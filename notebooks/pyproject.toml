[project]
name = "vgi-pysal-notebooks"
version = "0.1.0"
description = "Spatial graphs, classification, distribution summaries and model lifecycle"
requires-python = ">=3.13,<3.15"
dependencies = ["vgi-example-notebooks[runner] @ git+https://github.com/Query-farm/vgi-example-notebooks@v0.3.50"]

[tool.ruff]
builtins = ["diagnostics", "focal_neighbors", "moran_result", "summary", "checks", "metrics", "lorenz", "coefficients", "registry", "model_details", "predictions", "dropped"]
line-length = 110
target-version = "py313"
extend-exclude = ["artifacts", "validation"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E402"]
